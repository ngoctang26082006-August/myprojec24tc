<!DOCTYPE html>
<html lang="vi">
    <head>
        <title>Thiêt kế form</title>
         <meta charset = "utf-8">
         <link rel ="stylesheet" href ="../css/style4.css">   
    </head>
    <body>
            <table border="1">
                <caption>HÓA ĐƠN MUA HÀNG</caption>
                <tr>
                    <th>Tên sản phẩm </th>
                    <th>Số lượng</th>
                    <th>Đơn giá</th>
                    <th>Thành tiền</th>
                </tr>

                <tr>
                    <td>Cây viết</td>
                    <td class ="sl">3</td>
                    <td class ="dg">1000</td>
                    <td class ="tt"></td>
                </tr>

                 <tr>
                    <td>Thước kẻ</td>
                    <td class ="sl">3</td>
                    <td class ="dg">2000</td>
                    <td class ="tt"></td>
                </tr>

                 <tr>
                    <td>Bút xóa</td>
                    <td class ="sl">3</td>
                    <td class ="dg">3000</td>
                    <td class ="tt"></td>
                </tr>

                 <tr>
                    <td>Tập</td>
                    <td class ="sl">4</td>
                    <td class ="dg">4000</td>
                    <td class ="tt"></td>
                </tr>

                <tr>
                    <td>Hộp bút</td>
                    <td class ="sl">5</td>
                    <td class ="dg">8000</td>
                    <td class ="tt"></td>
                </tr>

                <tr>
                    <td>compa</td>
                    <td class ="sl">5</td>
                    <td class ="dg">3000</td>
                    <td class ="tt"></td>
                </tr>
                <tr>
                    <td>Sách Gk</td>
                    <td class ="sl">5</td>
                    <td class ="dg">32000</td>
                    <td class ="tt"></td>
                </tr>
                 
                  <tr>
                   <td colspan = "3">Tổng thanh toán</td>
                   <td id = "kq"></td>
                </tr>
            </table>
        <script> 
            const soLuong = document.getElementsByClassName("sl");
            const donGia = document.getElementsByClassName("dg");
            const thanhTien = document.getElementsByClassName("tt");

            let tongthanhtoan = 0;
            for(let i=0; i<soLuong.length; i++)
        {
             thanhTien[i].innerHTML = soLuong[i].innerHTML * donGia[i].innerHTML;
             tongthanhtoan += parseInt (thanhTien[i].innerHTML);
        }
         document.getElementById("kq").innerHTML = tongthanhtoan;
        </script>
    </body>
</html>
